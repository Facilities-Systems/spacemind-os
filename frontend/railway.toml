# SpaceMind OS — Frontend service (Railway)
# Place this file in the frontend/ directory.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# API_URL must be set in Railway dashboard to the deployed API service URL
# e.g. API_URL=https://spacemind-os-api.railway.app
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
