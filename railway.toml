# SpaceMind OS — Railway single-service configuration
# One container serves both the FastAPI backend and the React SPA.
# Docs: https://docs.railway.com/reference/config-as-code
#
# First-time setup in Railway dashboard:
#   1. Create a new project → "Deploy from GitHub repo"
#   2. Set root directory to "." (repo root) — Railway uses this Dockerfile
#   3. Add a PostgreSQL plugin (Railway auto-injects DATABASE_URL)
#   4. Set service variables:
#        ANTHROPIC_API_KEY = sk-ant-api03-...
#        SECRET_KEY        = <openssl rand -hex 32>
#        APP_ENV           = production
#        CORS_ORIGINS      = https://<your-service>.railway.app
#   5. Push to main → auto-deploy

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Run DB migrations before switching traffic, then start the server.
# Railway injects $PORT automatically.
startCommand = "sh -c 'echo \"=== PORT=$PORT ===\" && alembic upgrade head && uvicorn spacemind.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1 --log-level debug'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
