# SpaceMind OS — API service (Railway)
# Place this file in the backend/ directory.
# Railway will use it when this directory is the service root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run before traffic switches — equivalent to Fly's release_command
startCommand = "alembic upgrade head && uvicorn spacemind.main:app --host 0.0.0.0 --port $PORT --workers 2 --log-level info --no-access-log"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
