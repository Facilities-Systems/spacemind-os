[pytest]
filterwarnings =
    # starlette 0.40.x imports `multipart` instead of `python_multipart` — fixed in 0.41+
    ignore:Please use `import python_multipart`:PendingDeprecationWarning
    # python-jose uses datetime.utcnow() — upstream issue, not in our code
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:jose
