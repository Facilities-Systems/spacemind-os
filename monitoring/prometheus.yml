global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: spacemind-os

scrape_configs:
  - job_name: spacemind-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 15s
    # Only scrape when the API is healthy
    honor_labels: true
