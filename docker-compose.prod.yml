version: '3.9'

# ─── Production docker-compose ─────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Secrets expected in environment or a .env.prod file:
#   ANTHROPIC_API_KEY, SECRET_KEY, DATABASE_URL, SENTRY_DSN

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-spacemind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-spacemind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spacemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Alembic migration job (runs once, then exits) ────────────────────────────
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ─── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:latest
    restart: always
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - chromadb_data:/app/data/chromadb
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - internal

  # ─── Nginx + React frontend ───────────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - external

  # ─── Prometheus metrics scraper ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - internal

volumes:
  pgdata:
  chromadb_data:
  prometheus_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
