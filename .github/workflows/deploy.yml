name: CI / Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

jobs:
  # ─── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --no-header
        working-directory: backend

  # ─── Frontend type-check ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: node_modules/.bin/tsc --noEmit
        working-directory: frontend

  # ─── Deploy to Railway (single service) ─────────────────────────────────────
  # The root Dockerfile builds React then bakes it into the Python image.
  # FastAPI serves /assets/* and falls back to index.html for all SPA routes.
  #
  # Required secret:    RAILWAY_TOKEN       — project token from Railway dashboard → Settings → Tokens
  # Required variable:  RAILWAY_SERVICE_NAME — the exact service name in your Railway project
  #                     (GitHub → repo Settings → Secrets and variables → Variables)
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        run: railway up --detach --service "${{ vars.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Verify deployment health
        run: |
          echo "Waiting 45s for Railway to build and route traffic..."
          sleep 45
          STATUS=$(curl -sf --retry 6 --retry-delay 10 \
            ${{ vars.RAILWAY_APP_URL }}/api/v1/health \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null \
            || echo "unreachable")
          echo "Health: $STATUS"
          [ "$STATUS" = "operational" ] || \
            echo "⚠️  Health check inconclusive — Railway may still be starting. Check dashboard."
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
