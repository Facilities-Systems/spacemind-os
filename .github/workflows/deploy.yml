name: CI / Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

jobs:
  # ─── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --no-header
        working-directory: backend

  # ─── Frontend type-check ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: node_modules/.bin/tsc --noEmit
        working-directory: frontend

  # ─── Deploy to Railway ───────────────────────────────────────────────────────
  # Railway also auto-deploys via GitHub integration when connected in the
  # Railway dashboard — this job provides an explicit CI-gated deploy trigger.
  #
  # Required secrets:
  #   RAILWAY_TOKEN  — project token from Railway dashboard → Settings → Tokens
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy API service
        run: railway up --service spacemind-os-api --detach
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend service
        run: railway up --service spacemind-os-frontend --detach
        working-directory: frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify API health (post-deploy)
        run: |
          echo "Waiting 30s for Railway to route traffic..."
          sleep 30
          STATUS=$(curl -sf --retry 5 --retry-delay 10 \
            https://spacemind-os-api.railway.app/api/v1/health \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unreachable")
          echo "Health: $STATUS"
          [ "$STATUS" = "operational" ] || echo "⚠️  Health check inconclusive — Railway may still be starting. Check dashboard."
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
